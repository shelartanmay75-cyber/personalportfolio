<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16"/>
      <stop offset="100%" stop-color="#14142b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#bd53ff"/>
      <stop offset="100%" stop-color="#00ffaa"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00ffaa"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Glow Frame -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="22" filter="url(#neonGlow)"/>
  
  <!-- Accent Corner Dots -->
  <circle cx="80" cy="80" r="10" fill="#00f0ff" />
  <circle cx="432" cy="80" r="10" fill="#bd53ff" />
  <circle cx="432" cy="432" r="10" fill="#00ffaa" />
  <circle cx="80" cy="432" r="10" fill="#00f0ff" />

  <!-- Bold Initials TS -->
  <text x="256" y="338" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="240" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-10" filter="url(#neonGlow)">TS</text>
</svg>
